<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DiaryQuest | ホーム</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app"></main>

  <script type="module">
    import {
      boot, profile, getDiary, recentDiaries, countMyDiaries, getStreak, friendFeed,
      todayKey, WEEK, esc, entryItemHTML, errMsg, player, expBarHTML, battlesLeft,
    } from './js/app.js';
    import { levelInfo, BATTLES_PER_DAY } from './js/game.js';

    const ctx = await boot('index.html');
    if (ctx) render().catch((e) => { document.getElementById('app').innerHTML = `<div class="card empty">${esc(errMsg(e))}</div>`; });

    async function render() {
      const app = document.getElementById('app');
      const today = todayKey();
      const [todayDiary, recent, total] = await Promise.all([getDiary(today), recentDiaries(), countMyDiaries()]);

      const now = new Date();
      const h = now.getHours();
      const greet = h < 5 ? '夜ふかしですね 🌙' : h < 11 ? 'おはようございます ☀️' : h < 17 ? 'こんにちは 🌤️' : 'こんばんは 🌙';

      const hero = todayDiary
        // 書いたあと → ボタンは消えて、今日の日記を表示
        ? `<span class="done-badge">✓ 今日の日記は書きました</span>
           <div class="entry-list today-preview">${entryItemHTML(todayDiary, `diary.html?date=${today}`)}</div>`
        // まだ書いていない → 書くボタン
        : `<a class="btn primary write-btn" href="diary.html?date=${today}">✏️ 今日の日記を書く</a>
           <p class="muted" style="margin-top:16px">今日あったこと、見たもの、聴いたもの。ひとことでも大丈夫。</p>`;

      const ym = today.slice(0, 7);
      const past = recent.filter((d) => d.date !== today).slice(0, 5);

      app.innerHTML = `
        <section class="card hero">
          <div class="date">${now.getMonth() + 1}月${now.getDate()}日</div>
          <div class="weekday">${now.getFullYear()}年・${WEEK[now.getDay()]}曜日</div>
          <p class="greet">${greet}　${esc(profile.name)}さん</p>
          ${hero}
        </section>

        ${player ? `<a class="card game-mini" href="battle.html">
          <div class="lv-badge"><small>Lv</small>${levelInfo(player.exp).level}</div>
          <div style="flex:1;min-width:0">${expBarHTML(player.exp)}</div>
          <div class="game-mini-battle">⚔️ バトル<br><b>のこり ${battlesLeft()}/${BATTLES_PER_DAY}</b></div>
        </a>` : ''}

        <div class="stats" style="margin-top:20px">
          <div class="card stat"><b id="st-streak">…</b><span>連続日数</span></div>
          <div class="card stat"><b>${total ?? recent.length}</b><span>書いた日記</span></div>
          <div class="card stat"><b>${recent.filter((d) => d.date.startsWith(ym)).length}</b><span>今月</span></div>
        </div>

        <h2 class="section-title">最近の日記 <a class="btn small ghost" href="mypage.html">カレンダーで見る →</a></h2>
        <div class="entry-list">${past.length
          ? past.map((d) => entryItemHTML(d, `diary.html?date=${d.date}`)).join('')
          : '<div class="card empty">まだ過去の日記はありません</div>'}</div>

        <h2 class="section-title">友達の日記 <a class="btn small ghost" href="mypage.html#friends">友達を追加 →</a></h2>
        <div class="entry-list" id="friends"><div class="loading"><span class="spinner"></span></div></div>`;

      getStreak(recent).then((n) => { document.getElementById('st-streak').textContent = n; });

      const feedEl = document.getElementById('friends');
      try {
        const feed = await friendFeed();
        feedEl.innerHTML = feed.length
          ? feed.map((d) => entryItemHTML(d, `diary.html?u=${encodeURIComponent(d._uid)}&date=${d.date}`, `・${esc(d._name)}`)).join('')
          : '<div class="card empty">友達が「友達に公開」した日記がここに表示されます</div>';
      } catch (e) {
        feedEl.innerHTML = `<div class="card empty">${esc(errMsg(e))}</div>`;
      }
    }
  </script>
</body>
</html>
